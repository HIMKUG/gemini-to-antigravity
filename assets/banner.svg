<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Gemini to Antigravity relay workflow banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="45%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.82" cy="0.6" r="0.55">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7aa7ff" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#glowA)"/>
  <rect width="1200" height="420" fill="url(#glowB)"/>

  <!-- soft top hairline -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#beam)" opacity="0.55"/>

  <!-- Title block -->
  <g transform="translate(84,84)">
    <rect x="0" y="0" width="196" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="18" cy="15" r="4" fill="#4285F4"/>
    <text x="32" y="20" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#c7d2fe" letter-spacing="1.6">CLAUDE CODE SKILL</text>

    <text x="0" y="104" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#title)" letter-spacing="-1.2">Gemini to Antigravity</text>
    <text x="0" y="150" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8" letter-spacing="0.2">A deterministic two-AI relay: unlimited remote quota, local build authority.</text>
  </g>

  <!-- Left node: B AI / Gemini -->
  <g transform="translate(120,236)">
    <rect x="0" y="0" width="230" height="112" rx="18" fill="url(#cardA)" stroke="#4285F4" stroke-opacity="0.45"/>
    <rect x="0" y="0" width="230" height="112" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="30" cy="34" r="11" fill="#4285F4" fill-opacity="0.22" stroke="#4285F4" stroke-opacity="0.8"/>
    <text x="50" y="39" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">B AI · Gemini</text>
    <text x="20" y="68" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a7c4">unlimited quota · no toolchain</text>
    <text x="20" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a7c4">executes heavy code changes</text>
  </g>

  <!-- Right node: A AI / Antigravity -->
  <g transform="translate(850,236)">
    <rect x="0" y="0" width="230" height="112" rx="18" fill="url(#cardB)" stroke="#a855f7" stroke-opacity="0.45"/>
    <rect x="0" y="0" width="230" height="112" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="30" cy="34" r="11" fill="#a855f7" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.8"/>
    <text x="50" y="39" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">A AI · Antigravity</text>
    <text x="20" y="68" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b6a4cc">git · build · review authority</text>
    <text x="20" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b6a4cc">compiles &amp; ships the artifact</text>
  </g>

  <!-- Beam -->
  <g filter="url(#soft)">
    <path d="M355 292 H845" stroke="url(#beam)" stroke-width="3"/>
  </g>

  <!-- Outbound arrow (top) -->
  <g transform="translate(560,262)">
    <path d="M0 0 H132" stroke="#7aa7ff" stroke-width="2.5" stroke-opacity="0.9"/>
    <path d="M124 -7 L140 0 L124 7 Z" fill="#7aa7ff"/>
    <text x="26" y="-12" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8fb4ff" letter-spacing="0.6">HANDOFF · ZIP -9</text>
  </g>

  <!-- Inbound arrow (bottom) -->
  <g transform="translate(508,326)">
    <path d="M0 0 H-132" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.9"/>
    <path d="M-124 -7 L-140 0 L-124 7 Z" fill="#c084fc"/>
    <text x="-138" y="24" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#d0a4ff" letter-spacing="0.6">CHANGES · CHANGE_REPORT.md</text>
  </g>

  <!-- footer meta -->
  <g transform="translate(84,390)">
    <text font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b80" letter-spacing="0.4">max-compression source snapshot · self-contained handoff prompt · git-diff verified integration · local release build</text>
  </g>
</svg>
