name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontmatter present and well-formed
        run: |
          set -e
          test "$(head -n 1 SKILL.md)" = "---"
          grep -q '^name: gemini-to-antigravity$' SKILL.md
          desc=$(sed -n 's/^description: //p' SKILL.md | head -n 1)
          test -n "$desc"
          echo "description length: ${#desc}"
          test "${#desc}" -lt 1024

      - name: Handoff example declares the required sections
        run: |
          set -e
          grep -q '^## 1. User Original Request (Verbatim)' examples/GEMINI_HANDOFF.example.md
          grep -q '^## 2. Fault Ledger'                    examples/GEMINI_HANDOFF.example.md
          grep -q '^## 3. Requirement Ledger'              examples/GEMINI_HANDOFF.example.md
          grep -q '^## 4. Suspect Areas'                   examples/GEMINI_HANDOFF.example.md
          grep -q '^## 5. Execution Rules for You'         examples/GEMINI_HANDOFF.example.md
          grep -q '^## 6. Execution Ledger'                examples/GEMINI_HANDOFF.example.md
          grep -q '^## 7. Self-Audit Before Return'        examples/GEMINI_HANDOFF.example.md
          grep -q '^## 8. Deliverable & Return Contract'   examples/GEMINI_HANDOFF.example.md
          echo "handoff sections ok"

      - name: Every fault heading carries a locator
        run: |
          set -e
          for f in examples/GEMINI_HANDOFF.example.md examples/GEMINI_HANDOFF.lazy-round.md; do
            awk '/^## 2\./ {ins=1; next} /^## 3\./ {ins=0} ins && /^### F-/ && !/`/ {print FILENAME": "$0; bad=1} END {exit bad+0}' "$f"
          done
          echo "locators ok"

      - name: Fault statements contain no prescribed remedy
        run: |
          set -e
          if grep -E '^\- \*\*Problem:\*\*.*(replace|change .* to|use .* instead of|should call|add a call to)' \
               examples/GEMINI_HANDOFF.example.md; then
            echo "a Problem field reads as a remedy; state the fault only"
            exit 1
          fi
          echo "no remedy language"

      - name: Ledger checker accepts the complete example
        run: python3 scripts/check_ledger.py examples/GEMINI_HANDOFF.example.md --strict

      - name: Ledger checker rejects the lazy round
        run: |
          set +e
          python3 scripts/check_ledger.py examples/GEMINI_HANDOFF.lazy-round.md
          code=$?
          set -e
          echo "exit=$code"
          test "$code" -eq 1

      - name: Packager compiles and smoke-tests
        run: |
          set -e
          python3 -m py_compile scripts/pack_handoff.py scripts/check_ledger.py
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke/src
          cp examples/GEMINI_HANDOFF.example.md /tmp/smoke/GEMINI_HANDOFF.md
          printf 'hello\n' > /tmp/smoke/src/app.txt
          printf 'secret\n' > /tmp/smoke/.env
          mkdir -p /tmp/smoke/node_modules && printf 'x\n' > /tmp/smoke/node_modules/junk.txt
          python3 scripts/pack_handoff.py /tmp/smoke /tmp/smoke.zip
          python3 - <<'PY'
          import zipfile
          names = zipfile.ZipFile('/tmp/smoke.zip').namelist()
          assert names.count('GEMINI_HANDOFF.md') == 1, names
          assert 'src/app.txt' in names, names
          assert '.env' not in names, names
          assert not any(n.startswith('node_modules/') for n in names), names
          print('smoke ok:', names)
          PY

      - name: Relative links resolve
        run: |
          set -e
          rc=0
          for f in README.md README.zh-CN.md CONTRIBUTING.md docs/*.md; do
            targets=$(grep -oE '\]\([^)#]+\)' "$f" | sed 's/^](//; s/)$//' | grep -v -E '^(http|mailto)' || true)
            for target in $targets; do
              if [ ! -e "$target" ]; then
                echo "missing link target in $f: $target"
                rc=1
              fi
            done
          done
          test "$rc" -eq 0
          echo "links ok"

      - name: Required files exist
        run: |
          set -e
          for f in SKILL.md README.md README.zh-CN.md LICENSE CONTRIBUTING.md \
                   docs/PROTOCOL.md docs/AGENT-INTEGRATION.md docs/COMPARISON.md docs/OPERATIONS.md \
                   examples/GEMINI_HANDOFF.example.md examples/GEMINI_HANDOFF.lazy-round.md \
                   scripts/pack_handoff.py scripts/check_ledger.py \
                   assets/banner.svg assets/flow.svg; do
            test -f "$f"
          done
          echo "layout ok"
